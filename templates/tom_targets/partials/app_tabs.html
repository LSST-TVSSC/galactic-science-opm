{% load targets_extras %}
{% for target_tab in target_tabs_to_display %}
    <li class="nav-item">
        <a 
          class="nav-link {% if forloop.counter == 1 %} active {% endif %}" 
          id="{{target_tab.label|slugify}}-tab" 
          href="#{{target_tab.label|slugify}}" 
          role="tab" 
          data-bs-toggle="tab" 
          data-bs-target="#{{target_tab.label|slugify}}-tab-pane">
            {{target_tab.label}}
        </a>
    </li>
{% endfor %}
